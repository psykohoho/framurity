plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// Same source -> byte-for-byte same jar (no file timestamps, fixed order), so anyone can rebuild and compare.
tasks.withType(AbstractArchiveTask).configureEach {
	preserveFileTimestamps = false
	reproducibleFileOrder = true
}

// Print the jar's SHA-256 so anyone can compare a release download with a build they made themselves.
tasks.named("build") {
	def jar = file("build/libs/framurity-${project.version}.jar") // resolved now, not while running
	doLast {
		if (jar.exists()) {
			def digest = java.security.MessageDigest.getInstance("SHA-256").digest(jar.bytes)
			println "SHA-256 ${jar.name}: " + digest.collect { String.format("%02x", it) }.join()
		}
	}
}
